<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص الروابط</title>

    <style>
        body {
            background: #f5f6fa;
            font-family: 'Tahoma';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 380px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-top: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #004ecc;
        }

        .error {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>فحص الروابط المشبوهة</h2>
        <p>أدخل الرابط للتأكد من سلامته</p>

        <input id="urlInput" type="text" placeholder="https://example.com">

        <button onclick="scan()">فحص الرابط</button>

        <div id="error" class="error">الرجاء إدخال رابط صحيح</div>
    </div>

    <script>
        function scan() {
            const url = document.getElementById("urlInput").value.trim();
            const error = document.getElementById("error");

            if (url === "") {
                error.style.display = "block";
                return;
            }

            error.style.display = "none";

            // الانتقال لصفحة النتائج مع الرابط
            window.location.href = `/result.html?url=${encodeURIComponent(url)}`;
        }
    </script>
</body>
</html>
