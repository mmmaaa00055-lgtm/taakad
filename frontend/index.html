<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>فحص أمان الروابط</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="cyber-bg"></div>

<div class="center-box">
    <h1 class="title">🔒 فحص أمان الروابط</h1>
    <p class="subtitle">تحقق من سلامة أي رابط قبل أن تتعامل معه</p>

    <div class="input-area">
        <input id="urlInput" type="text" placeholder="https://example.com">
        <button onclick="checkURL()">فحص الرابط</button>
    </div>
</div>

<script>
function checkURL() {
    const url = document.getElementById("urlInput").value.trim();

    if (!url) {
        alert("الرجاء إدخال رابط صحيح");
        return;
    }

    window.location.href = `/result.html?url=${encodeURIComponent(url)}`;
}
</script>

</body>
</html>

<script>
function checkURL() {
    const url = document.getElementById("urlInput").value;

    if (!url.trim()) {
        alert("الرجاء إدخال رابط صحيح");
        return;
    }

    window.location.href = `/result.html?url=${encodeURIComponent(url)}`;
}
</script>

</body>
</html>
