<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>فحص أمان الروابط</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🔒 فحص أمان الروابط</h1>

<div class="input-box">
    <input id="urlInput" type="text" placeholder="أدخل رابط المتجر أو الموقع">
    <button onclick="checkURL()">فحص الرابط</button>
</div>

<script>
function checkURL() {
    const url = document.getElementById("urlInput").value;

    if (!url.trim()) {
        alert("الرجاء إدخال رابط صحيح");
        return;
    }

    window.location.href = `/result.html?url=${encodeURIComponent(url)}`;
}
</script>

</body>
</html>
