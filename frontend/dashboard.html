<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #f5f6fa;
            font-family: "Tahoma", sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            margin: 0;
            color: #3498db;
        }

        .card p {
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
        }

        .safe { color: #2ecc71; }
        .warning { color: #f1c40f; }
        .danger { color: #e74c3c; }
        .info { color: #2980b9; }

        .chart-box {
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 20px;
            font-size: 18px;
        }

        .back-btn:hover {
            background: #2980b9;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>📊 لوحة التحكم</h2>

    <div class="grid">
        <div class="card">
            <h3>المتاجر الآمنة</h3>
            <p id="safe" class="safe">0</p>
        </div>

        <div class="card">
            <h3>المتاجر المشبوهة</h3>
            <p id="warning" class="warning">0</p>
        </div>

        <div class="card">
            <h3>المتاجر الخطرة</h3>
            <p id="danger" class="danger">0</p>
        </div>

        <div class="card">
            <h3>مسجلة في معروف</h3>
            <p id="marouf" class="info">0</p>
        </div>

        <div class="card">
            <h3>لها سجل تجاري</h3>
            <p id="cr" class="info">0</p>
        </div>

        <div class="card">
            <h3>بلاغات حكومية</h3>
            <p id="reports" class="danger">0</p>
        </div>
    </div>

    <div class="chart-box">
        <canvas id="statsChart"></canvas>
    </div>

    <a href="/" class="back-btn">رجوع</a>
</div>

<script>
    fetch("/stats")
        .then(res => res.json())
        .then(data => {
            document.getElementById("safe").innerText = data.safe;
            document.getElementById("warning").innerText = data.warning;
            document.getElementById("danger").innerText = data.danger;
            document.getElementById("marouf").innerText = data.marouf;
            document.getElementById("cr").innerText = data.cr;
            document.getElementById("reports").innerText = data.reports;

            // رسم بياني
            const ctx = document.getElementById('statsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [
                        'آمنة',
                        'مشبوهة',
                        'خطرة',
                        'مسجلة في معروف',
                        'لها سجل تجاري',
                        'بلاغات حكومية'
                    ],
                    datasets: [{
                        label: 'عدد المتاجر',
                        data: [
                            data.safe,
                            data.warning,
                            data.danger,
                            data.marouf,
                            data.cr,
                            data.reports
                        ],
                        backgroundColor: [
                            '#2ecc71',
                            '#f1c40f',
                            '#e74c3c',
                            '#2980b9',
                            '#3498db',
                            '#c0392b'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        });
</script>

</body>
</html>
