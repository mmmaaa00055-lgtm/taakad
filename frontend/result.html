<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>نتيجة الفحص</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🔍 نتيجة الفحص</h1>

<div class="result-card" id="resultBox">
    <p>جاري تحميل البيانات...</p>
</div>

<a href="/" style="
    display:block;
    width:200px;
    margin:30px auto;
    text-align:center;
    padding:12px;
    background:#00eaff;
    color:#000;
    border-radius:10px;
    font-size:18px;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 0 15px rgba(0,255,255,0.4);
    transition:0.3s;
">
رجوع
</a>

<script>
const params = new URLSearchParams(window.location.search);
const url = params.get("url");

fetch(`/check?url=${encodeURIComponent(url)}`)
    .then(res => res.json())
    .then(data => {
        let statusClass =
            data.score > 70 ? "safe" :
            data.score > 40 ? "warning" : "danger";

        document.getElementById("resultBox").innerHTML = `
            <p><strong>🔗 الرابط:</strong> ${data.url}</p>
            <p class="${statusClass}"><strong>📊 الحالة:</strong> ${data.status}</p>
            <p><strong>🌐 النطاق:</strong> ${data.domain}</p>
            <p><strong>🏬 اسم المتجر:</strong> ${data.store_name}</p>
            <p><strong>🏛 السجل التجاري:</strong> ${translateCR(data.commercial_record)}</p>
            <p><strong>🛡 معروف:</strong> ${translateMarouf(data.marouf)}</p>
            <p><strong>⚠ البلاغات:</strong> ${translateReports(data.reports)}</p>
            <p><strong>🌍 نوع النطاق:</strong> ${translateRegistry(data.registry)}</p>
            <p><strong>🔐 درجة الأمان:</strong> ${data.score} / 100</p>
        `;
    });

function translateCR(v) {
    if (v === "valid") return "✔ السجل التجاري موجود";
    if (v === "not_found") return "❌ لا يوجد سجل تجاري";
    return "⚠ تعذر التحقق";
}

function translateMarouf(v) {
    if (v === "registered") return "✔ المتجر مسجل في معروف";
    if (v === "not_registered") return "❌ المتجر غير مسجل";
    return "⚠ تعذر التحقق";
}

function translateReports(v) {
    if (v === "has_reports") return "❌ توجد بلاغات وتحذيرات";
    if (v === "clean") return "✔ لا توجد بلاغات";
    return "⚠ تعذر التحقق";
}

function translateRegistry(v) {
    if (v === "saudi") return "✔ نطاق سعودي رسمي (.sa)";
    if (v === "global") return "🌍 نطاق عالمي";
    return "⚠ تعذر التحقق";
}
</script>

</body>
</html>
